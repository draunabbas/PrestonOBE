<title>Preston BSCS — Course Outlines</title>

<style>
:root {
  --navy: #163A63;
  --navy-deep: #0F2847;
  --gold: #A9793C;
  --gold-light: #E9DCC3;
  --bg: #FAF9F6;
  --surface: #FFFFFF;
  --border: #E4E1D8;
  --text: #22201B;
  --text-dim: #6B6456;
  --hdr-fill: #163A63;
  --row-alt: #F4F1EA;
  --radius: 6px;
  --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
  --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
:root:not([data-theme="light"]) {
  @media (prefers-color-scheme: dark) {
    --bg: #15130F;
    --surface: #1D1B16;
    --border: #35322A;
    --text: #EDEAE2;
    --text-dim: #A9A192;
    --row-alt: #232019;
    --gold-light: #3A2F1E;
  }
}
:root[data-theme="dark"] {
  --bg: #15130F;
  --surface: #1D1B16;
  --border: #35322A;
  --text: #EDEAE2;
  --text-dim: #A9A192;
  --row-alt: #232019;
  --gold-light: #3A2F1E;
}
* { box-sizing: border-box; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0; font-family: var(--sans); background: var(--bg); color: var(--text);
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  height: 100%;
}
html, body { height: 100%; }
a { color: var(--navy); }

.app { display: flex; height: 100vh; height: 100dvh; overflow: hidden; }

.sidebar {
  width: 320px; min-width: 320px; background: var(--surface); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; overflow: hidden;
  transition: transform .25s ease;
}
.sidebar-head {
  padding: 18px 18px 12px; border-bottom: 1px solid var(--border);
  padding-top: calc(18px + env(safe-area-inset-top, 0px));
}
.brand { font-family: var(--serif); font-weight: 700; font-size: 17px; color: var(--navy); line-height: 1.25; }
:root[data-theme="dark"] .brand, :root:not([data-theme="light"]) .brand { color: #DCE6F1; }
@media (prefers-color-scheme: dark) { .brand { color: #DCE6F1; } }
.brand-sub { font-size: 12.5px; color: var(--text-dim); margin-top: 2px; }
.search-wrap { margin-top: 12px; position: relative; }
.search-wrap input {
  width: 100%; padding: 9px 12px; border-radius: var(--radius); border: 1px solid var(--border);
  background: var(--bg); color: var(--text); font-size: 14px; font-family: var(--sans);
}
.search-wrap input:focus { outline: 2px solid var(--gold); outline-offset: -1px; }

.nav-scroll { flex: 1; overflow-y: auto; padding: 8px 10px 24px; }
.nav-group { margin-bottom: 4px; }
.nav-group-label {
  font-size: 11px; font-weight: 600; letter-spacing: .02em; color: var(--text-dim);
  padding: 12px 10px 4px;
}
.nav-list { list-style: none; margin: 0; padding: 0; }
.nav-item {
  width: 100%; text-align: left; background: none; border: none; cursor: pointer;
  padding: 7px 10px; border-radius: var(--radius); font-family: var(--sans); font-size: 13.5px;
  color: var(--text); display: flex; flex-direction: column; gap: 1px;
}
.nav-item:hover { background: var(--row-alt); }
.nav-item.active { background: var(--gold-light); }
.nav-item.active .nav-title { color: var(--navy); font-weight: 600; }
:root[data-theme="dark"] .nav-item.active .nav-title, :root:not([data-theme="light"]) .nav-item.active .nav-title { color: #CDE0F5; }
@media (prefers-color-scheme: dark) { .nav-item.active .nav-title { color: #CDE0F5; } }
.nav-code { font-size: 11px; color: var(--text-dim); font-variant-numeric: tabular-nums; }
.nav-title { line-height: 1.3; }
.nav-item.hidden { display: none; }

.main { flex: 1; overflow-y: auto; }
.main-inner { max-width: 860px; margin: 0 auto; padding: 28px 28px 80px; padding-top: calc(28px + env(safe-area-inset-top, 0px)); }

.topbar {
  display: none; align-items: center; gap: 10px; padding: 12px 14px; padding-top: calc(12px + env(safe-area-inset-top, 0px));
  border-bottom: 1px solid var(--border); background: var(--surface); position: sticky; top: 0; z-index: 5;
}
.menu-btn {
  width: 34px; height: 34px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--bg);
  display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;
}
.menu-btn svg { width: 18px; height: 18px; stroke: var(--text); }
.topbar-title { font-family: var(--serif); font-weight: 600; font-size: 15px; color: var(--navy); }

.course-eyebrow { font-size: 12.5px; color: var(--text-dim); margin-bottom: 6px; }
.course-title { font-family: var(--serif); font-size: 30px; font-weight: 700; line-height: 1.15; margin: 0 0 16px; color: var(--text); }

table.info { width: 100%; border-collapse: collapse; margin-bottom: 22px; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
table.info td { padding: 8px 12px; border: 1px solid var(--border); font-size: 13.5px; vertical-align: top; }
table.info td.k { background: var(--row-alt); font-weight: 600; width: 160px; }

h2.sec {
  font-family: var(--serif); font-size: 19px; font-weight: 700; color: var(--navy); margin: 30px 0 10px;
  padding-bottom: 6px; border-bottom: 2px solid var(--gold);
}
:root[data-theme="dark"] h2.sec, :root:not([data-theme="light"]) h2.sec { color: #CDE0F5; }
@media (prefers-color-scheme: dark) { h2.sec { color: #CDE0F5; } }
h3.sub { font-size: 14.5px; font-weight: 600; margin: 16px 0 6px; }
p.body-text { font-size: 14.5px; line-height: 1.65; margin: 0 0 10px; }
ul.plain { margin: 0 0 6px; padding-left: 20px; }
ul.plain li { font-size: 14.5px; line-height: 1.6; margin-bottom: 5px; }

table.data { width: 100%; border-collapse: collapse; margin-bottom: 14px; font-size: 13px; }
table.data th { background: var(--hdr-fill); color: #fff; text-align: left; padding: 8px 10px; font-weight: 600; }
table.data td { padding: 7px 10px; border: 1px solid var(--border); vertical-align: top; }
table.data tr:nth-child(even) td { background: var(--row-alt); }
table.data td.ctr, table.data th.ctr { text-align: center; }

.badge {
  display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 99px; margin-left: 8px;
  background: var(--gold-light); color: var(--gold); font-weight: 600; vertical-align: middle;
}
.src-note { font-size: 12px; color: var(--text-dim); font-style: italic; margin: 4px 0 16px; }

.ref-group { margin-bottom: 4px; }

.footnote { font-size: 12px; color: var(--text-dim); margin-top: 50px; border-top: 1px solid var(--border); padding-top: 14px; }

.sidebar-backdrop { display: none; }

@media (max-width: 860px) {
  .topbar { display: flex; }
  .sidebar {
    position: fixed; z-index: 20; top: 0; left: 0; bottom: 0; transform: translateX(-100%);
    box-shadow: 2px 0 18px rgba(0,0,0,.25);
  }
  .app.nav-open .sidebar { transform: translateX(0); }
  .app.nav-open .sidebar-backdrop {
    display: block; position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 15;
  }
  .main-inner { padding: 20px 16px 70px; }
  .course-title { font-size: 24px; }
}

::-webkit-scrollbar { width: 10px; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 6px; }
</style>

      <tr><td class="k">Category</td><td>${esc(c.category)}</td><td class="k">Credit Hours</td><td>${esc(c.credit_hours)}</td></tr>
      <tr><td class="k">Pre-requisite(s)</td><td>${esc(c.prerequisite)}</td><td class="k">Semester / Year</td><td>${esc(c.semester)}</td></tr>
      <tr><td class="k">Effective From</td><td>Fall 2026</td><td class="k">Lab/Practical</td><td>${c.has_lab ? 'Yes' : 'No'}</td></tr>
    </table>

    <h2 class="sec">Course Description</h2>
    <p class="body-text">${esc(c.description)}</p>

    <h2 class="sec">a. Course Objectives</h2>
    <ul class="plain">${objectives}</ul>

    <h2 class="sec">b. Course Learning Outcomes (CLOs) &amp; Mapping to GAs</h2>
    <table class="data">
      <tr><th class="ctr">CLO#</th><th>CLO Statement</th><th class="ctr">Bloom's Level</th><th class="ctr">PLO(s)/GA(s)</th><th>Assessment Tool</th></tr>
      ${cloRows}
    </table>

    <h2 class="sec">c. Course Contents</h2>
    <ul class="plain">${contents}</ul>

    <h2 class="sec">Course Teaching Methodology</h2>
    <p class="body-text">${esc(c.teaching_methodology)}</p>

    <h2 class="sec">d. Weekly Plan of Lecture Contents ${srcBadge}</h2>
    <table class="data">
      <tr><th class="ctr">Week</th><th>Topics / Contents</th><th class="ctr">Activity</th><th class="ctr">CLO(s)</th></tr>
      ${weeklyRows}
    </table>

    <h2 class="sec">Assurance of Learning &amp; Assessment Items</h2>
    <p class="body-text">${esc(c.assessment_text)}</p>

    <h2 class="sec">Assessment Structure, Marks Distribution &amp; Grading Policy</h2>
    <h3 class="sub">Distribution of Marks — Theory</h3>
    <table class="data">
      <tr><th class="ctr">Assignments/Project</th><th class="ctr">Quizzes</th><th class="ctr">Class Participation</th><th class="ctr">Mid-Term</th><th class="ctr">Sessional</th></tr>
      <tr>
        <td class="ctr">${c.marks_theory['Assignments/Project']}</td>
        <td class="ctr">${c.marks_theory['Quizzes']}</td>
        <td class="ctr">${c.marks_theory['Class Participation/Attendance']}</td>
        <td class="ctr">${c.marks_theory['Mid-Term Test']}</td>
        <td class="ctr"><strong>${c.marks_theory['Total Sessional']}</strong></td>
      </tr>
    </table>
    <table class="data">
      <tr><th class="ctr">Total Sessional</th><th class="ctr">Terminal (Final) Exam</th><th class="ctr">Grand Total</th></tr>
      <tr><td class="ctr">${c.marks_theory['Total Sessional']}</td><td class="ctr">${c.marks_theory['Terminal (Final) Exam']}</td><td class="ctr"><strong>${c.marks_theory['Grand Total']}</strong></td></tr>
    </table>
    ${labSection}

    <h3 class="sub">Grading Model (HEC / NCEAC Standard Absolute Grading Scale)</h3>
    <table class="data">
      <tr><th class="ctr">Letter Grade</th><th class="ctr">Percentage Range</th><th class="ctr">Grade Point</th></tr>
      ${grading}
    </table>

    <h2 class="sec">List of Reference Material</h2>
    ${refBlock(c.textbook_real.length > 1 ? 'Recommended Textbooks' : 'Recommended Textbook', c.textbook_real)}
    ${refBlock('Additional / Reference Books', c.refs.books)}
    ${refBlock('Websites', c.refs.websites)}
    ${refBlock('Research Articles / Book Chapters', c.refs.articles)}

    <div class="footnote">
      ${c.weekly_source === 'sourced'
        ? 'Description and/or weekly plan sourced from an official Preston University course outline document, lightly reformatted.'
        : 'Description, course contents, and weekly plan were drafted by the OBE team from the approved CLOs, as no official outline for this course version was available. Recommended for instructor review before adoption.'}
    </div>
  `;
}

function selectCourse(slug, push) {
  const c = bySlug[slug];
  if (!c) return;
  document.getElementById('content').innerHTML = renderCourse(c);
  document.getElementById('topbarTitle').textContent = c.title;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.slug === slug));
  document.getElementById('main').scrollTop = 0;
  if (push) { try { history.replaceState(null, '', '#' + slug); } catch(e) {} }
  try { localStorage.setItem('preston_bscs_last_course', slug); } catch(e) {}
  closeNav();
}

document.querySelectorAll('.nav-item').forEach(btn => {
  btn.addEventListener('click', () => selectCourse(btn.dataset.slug, true));
});

document.getElementById('search').addEventListener('input', (e) => {
  const q = e.target.value.trim().toLowerCase();
  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('hidden', q.length > 0 && !el.dataset.search.includes(q));
  });
  document.querySelectorAll('.nav-group').forEach(g => {
    const anyVisible = Array.from(g.querySelectorAll('.nav-item')).some(el => !el.classList.contains('hidden'));
    g.style.display = anyVisible ? '' : 'none';
  });
});

const app = document.getElementById('app');
function openNav() { app.classList.add('nav-open'); }
function closeNav() { if (window.innerWidth <= 860) app.classList.remove('nav-open'); }
document.getElementById('menuBtn').addEventListener('click', openNav);
document.getElementById('backdrop').addEventListener('click', closeNav);

// initial course: URL hash > last viewed (localStorage) > first course
let initial = (location.hash || '').replace('#', '');
if (!initial || !bySlug[initial]) {
  try { initial = localStorage.getItem('preston_bscs_last_course'); } catch(e) { initial = null; }
}
if (!initial || !bySlug[initial]) { initial = COURSES[0].slug; }
selectCourse(initial, false);
</script>
</body>
</html>
